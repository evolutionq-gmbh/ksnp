[project]
name = "ksnp"
version = "0.4.3"
description = "Python bindings for KSNP C API"
requires-python = ">=3.14"

[build-system]
requires = [
    "nanobind>=2.0",
    "scikit-build-core>=0.9",
]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    "nanobind>=2.0",
]

[project.scripts]
pyksnp-stream = "ksnp.cli.stream:main"
pyksnp-server = "ksnp.cli.server:main"
